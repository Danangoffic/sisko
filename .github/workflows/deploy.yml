name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"
  workflow_run:
    workflows: ["Build & Push Docker Image"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/danangoffic/sisko

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/secret.yml
          kubectl apply -f k8s/mysql.yml
          kubectl apply -f k8s/redis.yml
          kubectl apply -f k8s/app.yml
          kubectl apply -f k8s/worker.yml
          kubectl apply -f k8s/ingress.yml

      - name: Update image tag
        run: |
          kubectl set image deployment/sisko-app app=${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} -n sisko
          kubectl set image deployment/sisko-worker worker=${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} -n sisko

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sisko-app -n sisko --timeout=300s
